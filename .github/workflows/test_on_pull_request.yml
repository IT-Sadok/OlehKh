name: Build and Test .NET Application

on:
  pull_request:
    branches:
      - main
      - Develop

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PROJECT_PATH: './WEB_first_project/ASP.NET_CORE_Project#1'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}/ASP.NET_CORE__Project_1.sln"
  
    - name: Build project
        run: dotnet build "${{ env.PROJECT_PATH }}/ASP.NET_CORE__Project_1.sln"
  
    - name: Run tests
        run: dotnet test "${{ env.PROJECT_PATH }}/TestProject1/TestProject1.csproj"